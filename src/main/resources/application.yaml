spring:
  application:
    name: metriquegrafana

  #Recuperation des .env
  config:
    import : optional:file:.env[.properties]

  # Connexion a PostgreSQL
  datasource:
    url : jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username : ${DB_USER}
    password : ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL}
    properties :
      hibernate :
        format_sql: true

server:
  servlet:
    context-path: /api
  port: ${SERVER_PORT}